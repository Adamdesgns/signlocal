  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const outer = document.getElementById("f02-stays-here-zoom-outer");
      const inner = document.getElementById("f02-stays-here-zoom-inner");
      const frame = document.getElementById("f02-stays-here-frame");
      const target = document.getElementById("f02-stays-here-target");
      const claimOne = document.getElementById("f02-stays-here-claim-one");
      const claimTwo = document.getElementById("f02-stays-here-claim-two");
      const proofRule = document.getElementById("f02-stays-here-proof-rule");

      const frameRect = frame.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const targetOffsetX = targetRect.left + targetRect.width / 2 - (frameRect.left + frameRect.width / 2);
      const targetOffsetY = targetRect.top + targetRect.height / 2 - (frameRect.top + frameRect.height / 2);
      const maxScale = Math.min(
        (0.88 * frameRect.width) / targetRect.width,
        (0.88 * frameRect.height) / targetRect.height
      );
      const zoomScale = Math.min(1.08, maxScale);

      gsap.set([claimOne, claimTwo], { opacity: 0 });
      gsap.set(proofRule, { scaleX: 0 });

      tl.fromTo(
        frame,
        { opacity: 0.72, scale: 0.965 },
        { opacity: 1, scale: 1, duration: 0.48, ease: "power3.out" },
        0
      );

      tl.fromTo(
        outer,
        { scale: 1.0 },
        { scale: zoomScale, duration: 0.9, ease: "power3.inOut" },
        0.38
      );
      tl.fromTo(
        inner,
        { x: 0, y: 0 },
        { x: -targetOffsetX, y: -targetOffsetY, duration: 0.9, ease: "power3.inOut" },
        0.38
      );

      tl.fromTo(
        claimOne,
        { opacity: 0, y: 24, scale: 0.97 },
        { opacity: 1, y: 0, scale: 1, duration: 0.58, ease: "power3.out" },

      tl.to(proofRule, { scaleX: 1, duration: 0.52, ease: "power2.out" }, 1.5);

        claimOne,
        { opacity: 0, y: -28, duration: 0.34, ease: "power2.in" },
        3.2
      );

      );

window.__timelines["02-stays-here"] = tl;
